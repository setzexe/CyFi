<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maintenance | CyFi</title>
    <link rel="preload" as="image" href="{{ url_for('static', filename='images/aero-bg.png') }}" fetchpriority="high" />
    <style>
      :root {
        --bg-aero-fallback: #8fcde8;
        --glass-blur: 18px;
        --ink: #17324d;
        --muted: #4b687a;
        --shadow: rgba(23, 83, 130, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: "Nunito", "Segoe UI", "Frutiger", "Verdana", sans-serif;
        background-color: var(--bg-aero-fallback);
        background-image:
          linear-gradient(135deg, rgba(235, 255, 247, 0.18), rgba(88, 181, 255, 0.16), rgba(123, 219, 69, 0.12)),
          url("{{ url_for('static', filename='images/aero-bg.png') }}");
        background-size: cover, cover;
        background-position: center center, center center;
        background-attachment: fixed, fixed;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 12% 82%, rgba(255,255,255,0.28) 0 18px, transparent 19px),
          radial-gradient(circle at 88% 20%, rgba(255,255,255,0.22) 0 24px, transparent 25px),
          linear-gradient(to bottom, rgba(255,255,255,0.08), rgba(255,255,255,0));
      }

      .maintenance-shell {
        position: relative;
        z-index: 1;
        width: min(100%, 620px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 18px;
        display: grid;
        place-items: center;
      }

      .maintenance-card {
        width: 100%;
        padding: 34px 32px 30px;
        border: 1px solid rgba(255,255,255,0.86);
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(255,255,255,0.76), rgba(190,238,255,0.38));
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.96),
          inset 0 -22px 42px rgba(49,150,212,0.08),
          0 18px 44px var(--shadow);
        backdrop-filter: blur(var(--glass-blur)) saturate(160%);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
        overflow: hidden;
        position: relative;
        text-align: center;
      }

      .maintenance-card::before {
        content: "";
        position: absolute;
        inset: 10px 14px auto 14px;
        height: 34%;
        border-radius: 24px;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(255,255,255,0.58), rgba(255,255,255,0.08));
      }

      .maintenance-card > * {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        margin: 0;
        letter-spacing: 0.16em;
        font-size: 0.75rem;
        font-weight: 800;
        color: rgba(23, 50, 77, 0.7);
      }

      h1 {
        margin: 8px 0 12px;
        font-size: clamp(2.3rem, 9vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
        color: #132c45;
        text-shadow: 0 1px 0 rgba(255,255,255,0.72);
      }

      .message {
        max-width: 520px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1.08rem;
        font-weight: 800;
        line-height: 1.45;
      }

      @media (max-width: 560px) {
        .maintenance-card {
          padding: 28px 22px 24px;
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="maintenance-shell">
      <section class="maintenance-card" aria-labelledby="maintenanceTitle">
        <p class="eyebrow">CYFI</p>
        <h1 id="maintenanceTitle">Maintenance</h1>
        <p class="message">{{ message }}</p>
      </section>
    </main>
  </body>
</html>
